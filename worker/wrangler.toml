name = "gudauri-2027-assistant"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Workers AI: no API key needed; usage counts against the free daily allowance.
[ai]
binding = "AI"

# Per-IP burst protection (period must be 10 or 60 seconds).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Looser per-IP limit for cached data routes (/rates, later /weather, /itinerary).
[[ratelimits]]
name = "RL_DATA"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 60
  period = 60

# Shared cache for upstream data (rates, weather, calendar). The id is not a secret.
[[kv_namespaces]]
binding = "CACHE"
id = "3587a739aace4a73a4b2f88477cb2d41"

# Shared packing/to-do lists (one SQLite-backed Durable Object for the group).
[[durable_objects.bindings]]
name = "LISTS"
class_name = "ListsStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ListsStore"]

[vars]
# Comma-separated list of sites allowed to call the assistant.
ALLOWED_ORIGINS = "https://ofekfa.github.io,http://localhost:5173,http://localhost:4173"
# Bigger/smarter but ~6x costlier per request: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
